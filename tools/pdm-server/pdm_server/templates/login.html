{% extends "base.html" %}
{% block title %}Log in - PDM{% endblock %}
{% block main %}
<h1>Log in</h1>
<p>Paste a Forgejo access token. The service checks it with Forgejo; the token stays on the server and is never shown again.</p>
{% if message %}<p class="error" id="login-error">{{ message }}</p>{% endif %}
<form method="post" action="/web/login" autocomplete="off">
  <input type="hidden" name="login_csrf" value="{{ login_csrf }}">
  <label>Forgejo access token <input type="password" name="token" id="token" required size="48"></label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
